name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          SDK="$ANDROID_SDK_ROOT"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1"

      # Der Schluesselspeicher liegt NICHT im Repository. Wer die Geheimnisse
      # gesetzt hat, bekommt eine signierte APK; alle anderen eine mit dem
      # Debug-Schluessel - die laesst sich installieren, ist aber nicht die
      # offizielle Ausgabe.
      #
      # Der Schritt bricht NIE ab: ein unbrauchbarer Geheimnis-Inhalt fuehrt
      # zum Debug-Schluessel statt zu einem gescheiterten Bau. Leerzeichen,
      # Zeilenumbrueche und eine eventuelle Byte-Reihenfolge-Marke werden
      # vorher entfernt - genau daran scheitert das Kodieren unter Windows am
      # haeufigsten.
      - name: Prepare keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret set - building with the debug key."
            exit 0
          fi
          KS="$RUNNER_TEMP/tama.jks"
          printf '%s' "$KEYSTORE_BASE64" \
            | sed '1s/^\xEF\xBB\xBF//' \
            | tr -d '\r\n \t' \
            | base64 -d > "$KS" 2>/dev/null
          CHARS=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n \t' | wc -c)
          SZ=$(stat -c%s "$KS" 2>/dev/null || echo 0)
          MAGIC=$(head -c 2 "$KS" 2>/dev/null | od -An -tx1 | tr -d ' ')
          echo "secret: $CHARS base64 characters -> decoded $SZ bytes, first two bytes: $MAGIC"
          # Ein Schluesselspeicher (PKCS12 oder JKS) beginnt mit 3082 bzw. feed.
          if [ "$SZ" -gt 512 ] && { [ "$MAGIC" = "3082" ] || [ "$MAGIC" = "feed" ]; }; then
            echo "TAMA_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::KEYSTORE_BASE64 is not a usable keystore - building with the debug key."
            if [ "$MAGIC" = "3082" ] && [ "$SZ" -le 512 ]; then
              echo "The secret starts correctly but is TRUNCATED ($SZ of about 2700 bytes)."
              echo "Copying it through an editor or the console usually cuts it. In PowerShell:"
              echo '  $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\path\tama.keystore"))'
              echo '  $b64.Length      # must be about 3592'
              echo '  $b64 | Set-Clipboard'
              echo "then paste straight into the secret field."
            else
              echo "Expected roughly 3600 characters of pure base64, one line, no header lines."
            fi
            rm -f "$KS"
          fi
          exit 0

      # Prueft unter anderem NewApi: Aufrufe, die es auf Android 8 noch nicht
      # gibt. Faellt hier etwas auf, ist die APK auf alten Geraeten kaputt,
      # auch wenn sie sich installieren laesst.
      - name: Lint (API level check)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      - name: Build release APK
        env:
          TAMA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TAMA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TAMA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # Fingerabdruck ausgeben. Ein Update laesst sich nur ueber eine APK mit
      # DERSELBEN Signatur installieren - wer hier einen anderen Wert sieht als
      # bei seiner installierten Fassung, muss einmal deinstallieren.
      - name: Show signing certificate
        if: always()
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && exit 0
          SIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest\|Signer #1 certificate DN' || true
          fi
          if [ -z "$TAMA_KEYSTORE" ]; then
            echo "::warning::Built with the DEBUG key - this APK cannot update a release build, and the debug key differs per build machine."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tamaemu-apk
          path: app/build/outputs/apk/release/*.apk
